name: CI

on:
  push:
    branches: [main, fhac]
  pull_request:
    branches: [main, fhac]
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            src/requirements/*.txt
            src/requirements.txt
      # rtree is pinned to 0.9.1, which ships no wheel for current CPython and
      # is a ctypes wrapper, so libspatialindex has to be present to build it.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libspatialindex-dev
      - name: Install python dependencies
        run: pip install -r src/requirements.txt -r src/requirements/dev.txt
      - name: Django checks
        working-directory: src
        run: python manage.py check
      - name: Tests
        working-directory: src
        run: python manage.py test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements/dev.txt
      - name: Install linters
        run: pip install -r src/requirements/dev.txt

      # Blocking: syntax errors and undefined names only. These are real
      # breakage, never style. Kept green as of this commit.
      - name: flake8 (errors)
        working-directory: src
        run: flake8 --select=E9,F63,F7,F82 c3nav

      # Advisory: main carries a backlog of ~450 style findings from the
      # years CI was not running. Flip these to blocking once it is cleared.
      - name: flake8 (style)
        working-directory: src
        run: flake8 c3nav
        continue-on-error: true
      - name: isort
        working-directory: src
        run: isort -c c3nav
        continue-on-error: true

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Only log in when we are actually going to push. Pull requests from forks
      # get a read-only token, so a login step there would just fail.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<repo>, so this pushes to our own fork's registry and
      # never to ghcr.io/c3nav/*. metadata-action lowercases the name for us.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # Pull requests build only, so a broken Dockerfile is caught without
          # publishing anything. Pushes to our branches publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # the Dockerfile bakes this into C3NAV_VERSION
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
